<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRON 3D Holographic AI</title>
    <!-- Three.js 3D WebGL Graphics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #03070d;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }
        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #00E5FF;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
        }
        .status-badge {
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.45);
            color: rgba(0, 229, 255, 0.95);
            transition: all 0.3s ease;
        }
        /* 3D WebGL Matrix Container */
        .visualizer-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .state-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(0, 229, 255, 0.85);
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            min-height: 45px;
        }
        .chat-line {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
        }
        .user-line {
            color: rgba(210, 210, 210, 0.75);
        }
        .ai-line {
            color: #00E5FF;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }
        /* Controls & Input Area */
        .controls-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 6px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #004D5A 0%, #001A24 100%);
            border: 1px solid rgba(0, 229, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.3);
            transition: all 0.2s ease;
        }
        .mic-btn.active {
            background: radial-gradient(circle, #FF3311 0%, #AA1100 100%);
            border: 2px solid rgba(255, 60, 20, 0.95);
            box-shadow: 0 0 35px rgba(255, 60, 20, 0.7);
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 60, 20, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 60, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 60, 20, 0); }
        }
        .mic-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #00E5FF;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .mic-btn.active .mic-icon {
            stroke: #ffffff;
        }
        /* Mobile Input Field Fallback */
        .input-bar {
            width: 100%;
            display: flex;
            gap: 8px;
        }
        .cmd-input {
            flex: 1;
            background: rgba(5, 25, 40, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 10px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .cmd-input::placeholder {
            color: rgba(0, 229, 255, 0.45);
        }
        .send-btn {
            background: linear-gradient(135deg, #00E5FF, #0088CC);
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            color: #000000;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ULTRON</div>
        <div class="status-badge" id="badge">● ONLINE</div>
    </header>

    <div class="visualizer-container">
        <canvas id="webgl-canvas"></canvas>
    </div>

    <div style="width:100%; text-align:center;">
        <div class="state-label" id="state-text">SAY 'HEY' OR TAP MIC</div>

        <div class="chat-container">
            <div class="chat-line user-line" id="user-text"></div>
            <div class="chat-line ai-line" id="ai-text"></div>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="8" y1="22" x2="16" y2="22"></line>
                    </svg>
                </button>
            </div>

            <div class="input-bar">
                <input type="text" class="cmd-input" id="cmd-input" placeholder="Type command here..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendTextCommand()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // ── Three.js 3D WebGL Holographic Engine ─────────────────────────────
        const container = document.querySelector('.visualizer-container');
        const canvas = document.getElementById('webgl-canvas');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(320, 320);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        let isListening = false;
        let isSpeaking = false;

        // 1. Particle Core Swarm
        const particleCount = 4500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const cyanColor = new THREE.Color(0x00E5FF);
        const goldColor = new THREE.Color(0xFF9900);

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 0.85 + Math.random() * 0.45;

            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);

            const mixColor = u > 0.5 ? cyanColor : goldColor;
            colors[i * 3] = mixColor.r;
            colors[i * 3 + 1] = mixColor.g;
            colors[i * 3 + 2] = mixColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, particleMaterial);
        scene.add(particleSystem);

        // 2. Concentric Orbital Rings
        const ringGroup = new THREE.Group();
        const ringCount = 3;
        for (let r = 0; r < ringCount; r++) {
            const ringGeo = new THREE.TorusGeometry(1.1 + r * 0.3, 0.008, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({
                color: r % 2 === 0 ? 0x00E5FF : 0xFF9900,
                transparent: true,
                opacity: 0.65,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI * (0.2 + r * 0.25);
            ring.rotation.y = Math.PI * (0.15 * r);
            ringGroup.add(ring);
        }
        scene.add(ringGroup);

        // 3. Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            const speed = isSpeaking ? 1.8 : (isListening ? 1.2 : 0.6);
            particleSystem.rotation.y = elapsedTime * 0.3 * speed;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.2) * 0.2;

            ringGroup.children.forEach((ring, idx) => {
                ring.rotation.z = elapsedTime * (idx % 2 === 0 ? 0.4 : -0.5) * speed;
            });

            // Pulse radius on active states
            const scale = 1.0 + Math.sin(elapsedTime * 3.0) * (isSpeaking ? 0.08 : 0.03);
            particleSystem.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animate();

        // ── Web Socket & State Synchronization ──────────────────────────────
        function updateBadge(text, color) {
            const badge = document.getElementById('badge');
            badge.innerText = text;
            badge.style.color = color;
            badge.style.borderColor = color;
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                updateBadge('● ONLINE', '#00E5FF');
                document.getElementById('state-text').innerText = "SAY 'HEY' OR TAP MIC";
            } else {
                btn.classList.add('active');
                updateBadge('● LISTENING', '#FF3311');
                document.getElementById('state-text').innerText = "LISTENING FOR SIR...";
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendTextCommand();
        }

        function sendTextCommand() {
            const input = document.getElementById('cmd-input');
            const val = input.value.strip ? input.value.strip() : input.value.trim();
            if (!val) return;

            document.getElementById('user-text').innerText = "You: " + val;
            input.value = "";

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: val })
            })
            .then(res => res.json())
            .then(data => {
                if (data.response) {
                    document.getElementById('ai-text').innerText = "ULTRON: " + data.response;
                }
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
