<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRON Mobile - Holographic AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px;
            overflow: hidden;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #E8630A;
            text-shadow: 0 0 12px rgba(232,99,10,0.6);
        }
        .status-badge {
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(232,99,10,0.1);
            border: 1px solid rgba(232,99,10,0.45);
            color: rgba(232,99,10,0.9);
            transition: all 0.3s ease;
        }
        /* Matrix Container */
        .visualizer-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .state-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(232,99,10,0.8);
            text-transform: uppercase;
            margin-bottom: 12px;
            text-align: center;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            min-height: 50px;
        }
        .chat-line {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
        }
        .user-line {
            color: rgba(210, 210, 210, 0.75);
        }
        .ai-line {
            color: rgba(255, 160, 55, 0.95);
            font-weight: 600;
        }
        /* Controls & Input Area */
        .controls-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle, #3A0E00 0%, #1A0500 100%);
            border: 1px solid rgba(180,40,15,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(232,99,10,0.25);
            transition: all 0.2s ease;
        }
        .mic-btn.active {
            background: radial-gradient(circle, #FF3311 0%, #AA1100 100%);
            border: 2px solid rgba(255,60,20,0.95);
            box-shadow: 0 0 35px rgba(255,60,20,0.7);
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255,60,20,0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255,60,20,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,60,20,0); }
        }
        .mic-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #E8630A;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .mic-btn.active .mic-icon {
            stroke: #ffffff;
        }
        /* Mobile Input Field Fallback */
        .input-bar {
            width: 100%;
            display: flex;
            gap: 8px;
        }
        .cmd-input {
            flex: 1;
            background: rgba(30, 10, 5, 0.8);
            border: 1px solid rgba(232, 99, 10, 0.4);
            border-radius: 20px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .cmd-input::placeholder {
            color: rgba(232, 99, 10, 0.4);
        }
        .send-btn {
            background: linear-gradient(135deg, #E8630A, #B4280F);
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ULTRON</div>
        <div class="status-badge" id="badge">● ONLINE</div>
    </header>

    <div class="visualizer-container">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <div style="width:100%; text-align:center;">
        <div class="state-label" id="state-text">SAY 'HEY ULTRON' OR TAP MIC</div>

        <div class="chat-container">
            <div class="chat-line user-line" id="user-text"></div>
            <div class="chat-line ai-line" id="ai-text"></div>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="8" y1="22" x2="16" y2="22"></line>
                    </svg>
                </button>
            </div>

            <div class="input-bar">
                <input type="text" class="cmd-input" id="cmd-input" placeholder="Type command here..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendTextCommand()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // ── Canvas Scintillating Particle Matrix ──────────────────────────────
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 250;
        canvas.height = 250;

        let time = 0;
        let isListening = false;
        let isSpeaking = false;
        let wakeWordMode = true;

        function renderMatrix() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            time += isSpeaking ? 0.08 : (isListening ? 0.05 : 0.03);

            const rad = isSpeaking ? 85 : (isListening ? 70 : 55);
            const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, rad);
            grad.addColorStop(0, isSpeaking ? 'rgba(255, 180, 50, 0.95)' : 'rgba(232, 99, 10, 0.85)');
            grad.addColorStop(0.5, 'rgba(232, 99, 10, 0.25)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, Math.PI * 2);
            ctx.fill();

            const ringCount = 3;
            for (let r = 0; r < ringCount; r++) {
                const radius = 40 + r * 28 + Math.sin(time * 2 + r) * 5;
                const count = 35 + r * 18;
                const dir = r % 2 === 0 ? 1 : -1;
                const speed = time * dir * (0.8 + r * 0.3);

                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + speed;
                    const px = cx + Math.cos(angle) * radius;
                    const py = cy + Math.sin(angle) * radius * 0.65;

                    const phase = (i * 12.9898 + r * 78.233) % 6.28;
                    const blink = 0.5 + 0.5 * Math.sin(time * 24.0 + phase);
                    const size = (1.5 + Math.sin(phase) * 1.0 + (isSpeaking ? 1.5 : 0)) * blink;

                    ctx.fillStyle = isSpeaking ? `rgba(255, 200, 60, ${0.4 + blink * 0.6})` : `rgba(232, 99, 10, ${0.3 + blink * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(renderMatrix);
        }
        renderMatrix();

        // ── Speech Recognition Engine ───────────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function initSpeech() {
            if (!SpeechRecognition) {
                console.log("Speech recognition not supported on this browser.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                updateBadge('● LISTENING', '#FF3311');
                document.getElementById('state-text').innerText = 'LISTENING... SAY "HEY ULTRON"';
            };

            recognition.onend = function() {
                isListening = false;
                if (wakeWordMode) {
                    // Auto-restart continuous wake word listening
                    try { recognition.start(); } catch(e) {}
                } else if (!isSpeaking) {
                    updateBadge('● ONLINE', 'rgba(232,99,10,0.9)');
                    document.getElementById('state-text').innerText = "SAY 'HEY ULTRON' OR TAP MIC";
                }
            };

            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript.trim();
                    const rawLower = transcript.toLowerCase();

                    if (event.results[i].isFinal) {
                        console.log("Final Transcript:", transcript);

                        // Wake word check
                        if (rawLower.includes("hey ultron") || rawLower.includes("ultron") || rawLower.includes("hey altan") || rawLower.includes("hey eltron")) {
                            updateBadge('🔥 WAKE DETECTED', '#FF6600');
                            document.getElementById('state-text').innerText = 'WAKE DETECTED!';
                            
                            // Extract command after wake word if present
                            let cmd = transcript.replace(/hey ultron|ultron|hey altan|hey eltron/gi, "").strip();
                            if (cmd) {
                                sendCommand(cmd);
                            } else {
                                sendCommand("hello");
                            }
                        } else if (!wakeWordMode) {
                            sendCommand(transcript);
                        }
                    }
                }
            };

            try { recognition.start(); } catch(e) {}
        }

        function toggleMic() {
            if (!recognition) {
                initSpeech();
            }
            wakeWordMode = false;
            if (isListening) {
                try { recognition.stop(); } catch(e) {}
            }
            try { recognition.start(); } catch(e) {}
            document.getElementById('mic-btn').classList.add('active');
        }

        function sendTextCommand() {
            const input = document.getElementById('cmd-input');
            const text = input.value.trim();
            if (text) {
                sendCommand(text);
                input.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendTextCommand();
            }
        }

        function sendCommand(text) {
            document.getElementById('user-text').innerText = 'YOU   ' + text;
            updateBadge('◌ THINKING', '#FFC823');
            document.getElementById('state-text').innerText = 'PROCESSING...';

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: text })
            })
            .then(res => res.json())
            .then(data => {
                const reply = data.reply || "Done, Harsha!";
                speakResponse(reply);
            })
            .catch(err => {
                speakResponse("Processed command, Harsha!");
            });
        }

        function speakResponse(text) {
            isSpeaking = true;
            updateBadge('◎ SPEAKING', '#00C8FF');
            document.getElementById('state-text').innerText = 'SPEAKING...';
            document.getElementById('ai-text').innerText = 'ULTRON   ' + text;

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.onend = function() {
                    isSpeaking = false;
                    updateBadge('● ONLINE', 'rgba(232,99,10,0.9)');
                    document.getElementById('state-text').innerText = "SAY 'HEY ULTRON' OR TAP MIC";
                };
                window.speechSynthesis.speak(utter);
            } else {
                setTimeout(() => {
                    isSpeaking = false;
                    updateBadge('● ONLINE', 'rgba(232,99,10,0.9)');
                    document.getElementById('state-text').innerText = "SAY 'HEY ULTRON' OR TAP MIC";
                }, 3000);
            }
        }

        function updateBadge(text, color) {
            const b = document.getElementById('badge');
            b.innerText = text;
            b.style.color = color;
        }

        // Initialize Speech Engine on load
        window.onload = function() {
            initSpeech();
        };
    </script>
</body>
</html>
