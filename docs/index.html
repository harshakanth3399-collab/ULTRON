<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRON 3D Holographic AI</title>
    <!-- Three.js 3D WebGL Graphics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #060401;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #FFB300;
            text-shadow: 0 0 16px rgba(255, 179, 0, 0.85), 0 0 32px rgba(255, 111, 0, 0.5);
        }
        .status-badge {
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(255, 179, 0, 0.12);
            border: 1px solid rgba(255, 179, 0, 0.55);
            color: #FFC107;
            box-shadow: 0 0 12px rgba(255, 179, 0, 0.25);
            transition: all 0.3s ease;
        }
        /* 3D WebGL Matrix Container */
        .visualizer-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .state-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(255, 193, 7, 0.9);
            text-shadow: 0 0 8px rgba(255, 145, 0, 0.5);
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            min-height: 45px;
        }
        .chat-line {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
        }
        .user-line {
            color: rgba(230, 220, 200, 0.75);
        }
        .ai-line {
            color: #FFC107;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 179, 0, 0.5);
        }
        /* Controls & Input Area */
        .controls-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 6px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #4A2B00 0%, #1A0D00 100%);
            border: 1px solid rgba(255, 179, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(255, 179, 0, 0.35);
            transition: all 0.2s ease;
        }
        .mic-btn.active {
            background: radial-gradient(circle, #FF6F00 0%, #B71C1C 100%);
            border: 2px solid rgba(255, 145, 0, 0.95);
            box-shadow: 0 0 35px rgba(255, 145, 0, 0.7);
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 179, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0); }
        }
        .mic-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #FFB300;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .mic-btn.active .mic-icon {
            stroke: #ffffff;
        }
        /* Mobile Input Field Fallback */
        .input-bar {
            width: 100%;
            display: flex;
            gap: 8px;
        }
        .cmd-input {
            flex: 1;
            background: rgba(25, 15, 3, 0.85);
            border: 1px solid rgba(255, 179, 0, 0.45);
            border-radius: 20px;
            padding: 10px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .cmd-input::placeholder {
            color: rgba(255, 179, 0, 0.45);
        }
        .send-btn {
            background: linear-gradient(135deg, #FFB300, #FF6F00);
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            color: #000000;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 179, 0, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ULTRON</div>
        <div class="status-badge" id="badge">● ONLINE</div>
    </header>

    <div class="visualizer-container">
        <canvas id="webgl-canvas"></canvas>
    </div>

    <div style="width:100%; text-align:center;">
        <div class="state-label" id="state-text">SAY 'HEY' OR TAP MIC</div>

        <div class="chat-container">
            <div class="chat-line user-line" id="user-text"></div>
            <div class="chat-line ai-line" id="ai-text"></div>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="8" y1="22" x2="16" y2="22"></line>
                    </svg>
                </button>
            </div>

            <div class="input-bar">
                <input type="text" class="cmd-input" id="cmd-input" placeholder="Type command here..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendTextCommand()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // ── Three.js 3D WebGL Holographic Engine (J.A.R.V.I.S. Neural Matrix) ──
        const container = document.querySelector('.visualizer-container');
        const canvas = document.getElementById('webgl-canvas');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(320, 320);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        let isListening = false;
        let isSpeaking = false;

        // 1. J.A.R.V.I.S. Particle Core Swarm (Incandescent Gold & Amber Orange)
        const particleCount = 6500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const basePositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const goldColor = new THREE.Color(0xFFD700);       // Pure Incandescent Gold
        const amberColor = new THREE.Color(0xFFA000);      // Warm Radiant Amber
        const orangeColor = new THREE.Color(0xFF6F00);     // Molten Flame Orange
        const whiteGoldColor = new THREE.Color(0xFFF9C4);  // Luminous Core Spark

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 0.88 + Math.random() * 0.46;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            positions[i * 3]     = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            basePositions[i * 3]     = x;
            basePositions[i * 3 + 1] = y;
            basePositions[i * 3 + 2] = z;

            // Authentic J.A.R.V.I.S. movie color distribution
            const mixRatio = Math.sin(phi * 2.5 + theta * 1.5) * 0.5 + 0.5;
            let c;
            if (u < 0.12) {
                c = whiteGoldColor;
            } else if (mixRatio > 0.65) {
                c = goldColor.clone().lerp(amberColor, Math.random() * 0.5);
            } else {
                c = amberColor.clone().lerp(orangeColor, Math.random() * 0.6);
            }

            colors[i * 3]     = c.r;
            colors[i * 3 + 1] = c.g;
            colors[i * 3 + 2] = c.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.042,
            vertexColors: true,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, particleMaterial);
        scene.add(particleSystem);

        // 2. Animation Loop (Fluid Organic Neural Wave)
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            const speed = isSpeaking ? 1.8 : (isListening ? 1.25 : 0.65);
            particleSystem.rotation.y = elapsedTime * 0.28 * speed;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.22) * 0.18;
            particleSystem.rotation.z = Math.cos(elapsedTime * 0.18) * 0.15;

            // Organic undulating wave ripple across particle grid
            const posAttr = geometry.attributes.position;
            const pArr = posAttr.array;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const bx = basePositions[i3];
                const by = basePositions[i3 + 1];
                const bz = basePositions[i3 + 2];

                const wave = Math.sin(elapsedTime * 2.0 + bx * 3.0 + bz * 2.5) * 0.07
                           + Math.cos(elapsedTime * 1.4 + by * 3.5) * 0.05;

                pArr[i3]     = bx * (1.0 + wave * 0.35);
                pArr[i3 + 1] = by + wave;
                pArr[i3 + 2] = bz * (1.0 + wave * 0.35);
            }
            posAttr.needsUpdate = true;

            // Pulse radius on active states
            const scale = 1.0 + Math.sin(elapsedTime * 3.0) * (isSpeaking ? 0.09 : 0.035);
            particleSystem.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animate();

        // ── Web Socket & State Synchronization ──────────────────────────────
        function updateBadge(text, color) {
            const badge = document.getElementById('badge');
            badge.innerText = text;
            badge.style.color = color;
            badge.style.borderColor = color;
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                updateBadge('● ONLINE', '#FFC107');
                document.getElementById('state-text').innerText = "SAY 'HEY' OR TAP MIC";
            } else {
                btn.classList.add('active');
                updateBadge('● LISTENING', '#FF6F00');
                document.getElementById('state-text').innerText = "LISTENING FOR SIR...";
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendTextCommand();
        }

        function sendTextCommand() {
            const input = document.getElementById('cmd-input');
            const val = input.value.strip ? input.value.strip() : input.value.trim();
            if (!val) return;

            document.getElementById('user-text').innerText = "You: " + val;
            input.value = "";

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: val })
            })
            .then(res => res.json())
            .then(data => {
                if (data.response) {
                    document.getElementById('ai-text').innerText = "ULTRON: " + data.response;
                }
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
